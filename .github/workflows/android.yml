name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # needed to dispatch the Pages workflow after a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('kimep-android/**/*.gradle*', 'kimep-android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # Secrets are injected as env (the `secrets` context is not allowed in step `if`).
      - name: Decode signing keystore
        working-directory: kimep-android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets available — release will fall back to debug signing."
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/kimep-release.jks
          printf 'storeFile=keystore/kimep-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          echo "Keystore written."

      - name: Run unit tests
        working-directory: kimep-android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug
        working-directory: kimep-android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release
        working-directory: kimep-android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify release signature
        working-directory: kimep-android
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks-${{ github.sha }}
          path: |
            kimep-android/app/build/outputs/apk/debug/*.apk
            kimep-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: kimep-android/app/build/outputs/apk/release/*.apk

      # Events created with the default GITHUB_TOKEN do not trigger other
      # workflows, so the `release: published` trigger in pages.yml never fires
      # on its own. Dispatch it explicitly to refresh the download page.
      - name: Refresh the download page
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
